name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task-manager
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: task-manager_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U task-manager -d task-manager_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: task-manager_testing
      DB_USERNAME: task-manager
      DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: exif, pcntl, zip, mbstring, bcmath, sockets, dom, xml, gd, pdo, pdo_pgsql, intl, gmp
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests (Pest)
        run: vendor/bin/pest
