# docker-compose.yml
x-defaults: &defaults
  restart: unless-stopped
  tty: true
  ulimits:
    nofile:
      soft: "${ULIMITS_NOFILE_SOFT:-65536}"
      hard: "${ULIMITS_NOFILE_HARD:-1048576}"
  networks:
    - shared-network

services:
  task-manager-nginx:
    <<: *defaults
    profiles: ["homolog", "main"]
    build:
      context: .docker/nginx
      dockerfile: Dockerfile
      args:
        ID_GROUP_LINUX: ${ID_GROUP_LINUX:-1001}
        ID_USER_LINUX: ${ID_USER_LINUX:-1001}
        APP_ENV: ${APP_ENV:-local}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    container_name: "${PREFIX:-task-manager}_${NGINX_CONTAINER_NAME:-api_nginx}"
    environment:
      SERVICE_NAME: task-manager_api_nginx
      TZ: "${APP_TIMEZONE:-America/Boa_Vista}"
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-api.local}
    volumes:
      - '.:/var/www/html:cached'
      - './.docker/nginx/nginx.${PROFILE:-local}.conf:/etc/nginx/nginx.conf:ro'
      - './.docker/nginx/conf.d/task-manager-api.${PROFILE:-local}.conf:/etc/nginx/conf.d/task-manager-api.${PROFILE:-local}.conf:ro'
      - './.docker/nginx/logs:/var/log/nginx'
      - ${SSL_CERT_PATH:-./.docker/nginx/ssl}:${SSL_CERT_DEST:-/etc/nginx/ssl}:ro
      - 'task-manager-api-php-socket:/tmp/:ro'
    depends_on:
      - task-manager-php-fpm

  task-manager-php-fpm:
    <<: *defaults
    profiles: ["homolog", "main"]
    shm_size: 256m
    build:
      context: .docker/php
      dockerfile: Dockerfile
      args:
        ID_GROUP_LINUX: ${ID_GROUP_LINUX:-1001}
        ID_USER_LINUX: ${ID_USER_LINUX:-1001}
        PHP_VERSION: ${PHP_VERSION:-8.4}
    container_name: "${PREFIX:-task-manager}_${PHP_CONTAINER_NAME:-api_php}"
    environment:
      SERVICE_NAME: api
      VIRTUAL_HOST: ${APP_URL:-api.local}
      TZ: "${APP_TIMEZONE:-America/Boa_Vista}"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: "${DB_HOST:-central-db}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_HOST: "${REDIS_HOST:-task-manager-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    volumes:
      - '.:/var/www/html'
      - './.docker/php/php.ini:/usr/local/etc/php/php.ini:ro'
      - './.docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini:ro'
      - './.docker/php/conf.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro'
      - 'task-manager-api-php-socket:/tmp/:rw'
    depends_on:
      - task-manager-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  task-manager-redis:
    <<: *defaults
    profiles: ["homolog", "main"]
    build:
      context: .docker/redis
      dockerfile: Dockerfile
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    container_name: "${PREFIX:-task-manager}_${REDIS_CONTAINER_NAME:-redis}"
    environment:
      TZ: "${APP_TIMEZONE:-America/Boa_Vista}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_password}"
    volumes:
      - 'task-manager-api-redis:/data'
    command: >
      redis-server --requirepass '${REDIS_PASSWORD:-redis_password}' --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
      interval: 10s

  pgsql:
    <<: *defaults
    profiles: ["homolog"]
    shm_size: 512m
    image: "postgres:16-alpine"
    container_name: "${PREFIX:-task-manager}_homolog_postgres"
    ports:
      - '5433:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE:-task-manager}'
      POSTGRES_USER: '${DB_USERNAME:-task-manager}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
      TZ: "${APP_TIMEZONE:-America/Boa_Vista}"
    volumes:
      - 'task-manager-api-pgsql-homolog:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-task-manager}", "-U", "${DB_USERNAME:-task-manager}"]
      retries: 3
      timeout: 5s
      interval: 10s

networks:
  shared-network:
    external: true

volumes:
  task-manager-api-redis:
    driver: local
  task-manager-api-php-socket:
    driver: local
  task-manager-api-pgsql-homolog:
    driver: local
