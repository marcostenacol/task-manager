zend_extension=opcache

[opcache]
opcache.enable=1
opcache.revalidate_freq=${PHP_OPCACHE_REVALIDATE_FREQ}
opcache.memory_consumption=${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.max_accelerated_files=${PHP_OPCACHE_MAX_ACCELERATED_FILES}
opcache.interned_strings_buffer=${PHP_OPCACHE_INTERNED_STRINGS_BUFFER}
opcache.enable_cli=${PHP_OPCACHE_ENABLE_CLI}
opcache.save_comments=${PHP_OPCACHE_SAVE_COMMENTS}
opcache.max_wasted_percentage=${PHP_OPCACHE_MAX_WASTED_PERCENTAGE}
opcache.huge_code_pages=${PHP_OPCACHE_HUGE_CODE_PAGES}
; JIT desligado de propósito: causava SIGSEGV aleatório em workers do
; PHP-FPM em produção (crash-loop silencioso, mascarado pelo supervisor —
; ver logs de "child exited on signal 11"), padrão real e conhecido do
; tracing JIT sob workers de longa duração. Sem ganho relevante pra uma
; app web/FPM (JIT ajuda workload CPU-bound tipo CLI/benchmark, não
; request-response comum) — o ganho de opcache normal (bytecode cache)
; é mantido acima, só o JIT em si foi desligado.
opcache.jit_buffer_size=0
opcache.jit=off

; opcache.fast_shutdown=${PHP_OPCACHE_FAST_SHUTDOWN}

